<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ownership</title>
<link rel="stylesheet" href="style.css">
<style>
.lw-board{position:relative;overflow:hidden;margin-top:34px}
.lw-cols{max-width:1088px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.lw-slot{position:relative;height:700px}
.lw-pend{position:absolute;left:50%;top:0;width:0;height:0;transform-origin:0 0;cursor:grab;touch-action:none;-webkit-user-select:none;user-select:none}
.lw-pend:active{cursor:grabbing}
.lw-pend:focus-visible{outline:2px solid #68a9ed;outline-offset:3px}
.lw-strap{position:absolute;left:-27px;top:-500px;width:54px;height:840px;overflow:hidden;display:flex;flex-direction:column-reverse;align-items:center;gap:14px;padding-bottom:10px;color:#fff;
background:repeating-linear-gradient(90deg,#ffffff14 0 2px,transparent 2px 4px),linear-gradient(90deg,#1258a3,#1871cd 20%,#1871cd 80%,#1258a3)}
.lw-strap>*{flex:none}
.lw-strap b{writing-mode:vertical-rl;transform:rotate(180deg);font-size:19px;font-weight:600;white-space:nowrap}
.lw-logo{width:26px;height:26px;object-fit:contain}
.lw-strap i{width:22px;height:22px;border-radius:50%;border:5px solid #fff;border-right-color:transparent}
.lw-card{position:absolute;left:-112px;top:330px;width:224px;height:308px;perspective:1000px}
.lw-in{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.lw-card.on .lw-in{transform:rotateY(180deg)}
.lw-face{position:absolute;top:0;left:0;right:0;bottom:0;border-radius:24px;overflow:hidden;background:#fff;color:#111;-webkit-backface-visibility:hidden;backface-visibility:hidden;box-shadow:0 14px 36px #000a}
.lw-band{height:96px;background:radial-gradient(circle at 18% 32%,#ffffffb3 0 1.5px,transparent 2.5px),radial-gradient(circle at 72% 58%,#ffffff99 0 1.5px,transparent 2.5px),radial-gradient(circle at 44% 82%,#ffffff80 0 1px,transparent 2px),linear-gradient(135deg,#68a9ed,#1871cd);position:relative;overflow:hidden}
.lw-band.has::after{display:none}
.lw-band::after{content:"";position:absolute;right:-34px;top:22px;width:120px;height:120px;border-radius:50%;background:#ffffff1f}
.lw-slit{position:absolute;left:50%;top:13px;width:46px;height:8px;margin-left:-23px;border-radius:5px;background:#0d4a8f;z-index:1}
.lw-av{position:absolute;left:50%;top:44px;width:104px;height:104px;margin-left:-52px;border-radius:50%;border:4px solid #fff;object-fit:cover;background:#cfe3fa;color:#1871cd;font-weight:700;font-size:28px;display:grid;place-items:center;box-shadow:0 2px 8px #0003}
.lw-name{position:absolute;left:0;right:0;top:160px;text-align:center;font-size:17px;font-weight:600;color:#1871cd;padding:0 10px}
.lw-role{position:absolute;left:0;right:0;top:186px;text-align:center;font-size:13px;color:#222;padding:0 10px}
.lw-code{position:absolute;left:0;right:0;bottom:0;height:84px;background:#f6f6f6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
.lw-pid{font:10px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em;color:#999}
.lw-back{transform:rotateY(180deg);background:linear-gradient(160deg,#1871cd,#0e4a91);color:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:28px;gap:10px}
.lw-back h3{font-size:18px;font-weight:600}
.lw-back p{font-size:14px;line-height:1.5;color:#e6f1ff}
.lw-back .lw-pid{color:#bcd8f8}
@media(max-width:1000px){.lw-cols{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.lw-cols{grid-template-columns:1fr}}
</style>
</head>
<body>
<canvas id="stars" aria-hidden="true"></canvas>
<header><nav aria-label="Main"></nav></header>
<main>
  <div class="title">
    <h1>The owners</h1>
    <p>Grab a badge and swing it around. Tap it to flip it.</p>
  </div>
  <div class="lw-board"><div class="lw-cols" id="lwcols"></div></div>
</main>
<footer></footer>
<script src="site.js"></script>
<script>
if (typeof CONFIG === "undefined") {
  document.querySelector("main").insertAdjacentHTML("beforeend", "<p style='padding:6vw'>site.js did not load. Put site.js in the same folder as this page.</p>");
  throw new Error("site.js missing");
}
const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
const prefix = CONFIG.company.split(/\s+/).map(w => w[0]).join("").toUpperCase().slice(0, 3) || "ID";

function barcode(seed) {
  let h = 7; for (const c of seed) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  const r = () => (h = (h * 1664525 + 1013904223) >>> 0) / 4294967296;
  let x = 0, out = "";
  while (x < 158) { const w = 1 + Math.floor(r() * 3); out += `<rect x="${x}" width="${w}" height="28"/>`; x += w + 1 + Math.floor(r() * 2); }
  return `<svg viewBox="0 0 160 28" width="160" height="28" fill="#111" aria-hidden="true">${out}</svg>`;
}

const lwCols = document.getElementById("lwcols"), items = [];
CONFIG.owners.forEach((o, i) => {
  const id = prefix + "-" + (1001 + i);
  const slot = document.createElement("div");
  slot.className = "lw-slot";
  slot.innerHTML = `<div class="lw-pend" tabindex="0" role="button">
    <div class="lw-strap"></div>
    <div class="lw-card"><div class="lw-in">
      <div class="lw-face"><div class="lw-band"><span class="lw-slit"></span></div><div class="lw-av"></div><div class="lw-name"></div><div class="lw-role"></div>
        <div class="lw-code">${barcode(id)}<span class="lw-pid">${id}</span></div></div>
      <div class="lw-face lw-back"><h3></h3><p></p><span class="lw-pid">${id}</span></div>
    </div></div></div>`;
  const el = slot.querySelector(".lw-pend"), card = slot.querySelector(".lw-card"), strap = slot.querySelector(".lw-strap");
  el.setAttribute("aria-label", "Flip badge for " + o.name);
  for (let k = 0; k < 6; k++) {
    let mark;
    if (CONFIG.logo) { mark = new Image(); mark.src = CONFIG.logo; mark.alt = ""; mark.className = "lw-logo"; }
    else mark = document.createElement("i");
    strap.appendChild(mark);
    const b = document.createElement("b"); b.textContent = CONFIG.strapText || CONFIG.company; strap.appendChild(b);
  }
  slot.querySelector(".lw-name").textContent = o.name;
  slot.querySelector(".lw-role").textContent = o.role;
  slot.querySelector(".lw-back h3").textContent = o.name;
  slot.querySelector(".lw-back p").textContent = o.bio || "";
  const band = slot.querySelector(".lw-band");
  if (o.banner) {
    band.classList.add("has");
    band.style.backgroundImage = `url("${o.banner}"), linear-gradient(135deg,#68a9ed,#1871cd)`;
    band.style.backgroundSize = "cover, auto";
    band.style.backgroundPosition = "center";
  }
  const av = slot.querySelector(".lw-av");
  av.textContent = o.name.split(/\s+/).map(w => w[0]).slice(0, 2).join("").toUpperCase();
  if (o.photo) { const im = new Image(); im.className = "lw-av"; im.alt = o.name; im.onload = () => av.replaceWith(im); im.src = o.photo; }

  const s = { el, th: calm ? 0 : (i % 2 ? -1 : 1) * (.3 + Math.random() * .15), w: 0, drag: null };
  const ang = e => { const r = slot.getBoundingClientRect(); return Math.atan2(r.left + r.width / 2 - e.clientX, Math.max(8, e.clientY - r.top)); };
  el.addEventListener("pointerdown", e => {
    s.drag = { a0: ang(e), t0: s.th, sx: e.clientX, sy: e.clientY, moved: 0, tgt: s.th };
    el.setPointerCapture(e.pointerId); slot.style.zIndex = 2;
  });
  el.addEventListener("pointermove", e => {
    const d = s.drag; if (!d) return;
    d.moved = Math.max(d.moved, Math.hypot(e.clientX - d.sx, e.clientY - d.sy));
    if (d.moved > 5) d.tgt = Math.max(-1.2, Math.min(1.2, d.t0 + ang(e) - d.a0));
  });
  const up = () => {
    if (!s.drag) return;
    if (s.drag.moved <= 5) card.classList.toggle("on");
    s.w = Math.max(-12, Math.min(12, s.w)); s.drag = null; slot.style.zIndex = "";
  };
  el.addEventListener("pointerup", up); el.addEventListener("pointercancel", up);
  el.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); card.classList.toggle("on"); s.w += 3; } });
  lwCols.appendChild(slot); items.push(s);
});

let lwLast = performance.now();
(function tick(now) {
  const dt = Math.max(.001, Math.min(.033, (now - lwLast) / 1000)); lwLast = now;
  for (const s of items) {
    const d = s.drag;
    if (d && d.moved > 5) { const p = s.th; s.th += (d.tgt - s.th) * Math.min(1, dt * 18); s.w = (s.th - p) / dt; }
    else if (!d) {
      s.w += (-11 * Math.sin(s.th) - .55 * s.w) * dt; s.th += s.w * dt;
      if (Math.abs(s.th) < 1e-4 && Math.abs(s.w) < 1e-3) { s.th = 0; s.w = 0; }
    }
    s.el.style.transform = `rotate(${s.th}rad)`;
  }
  requestAnimationFrame(tick);
})(performance.now());
</script>
</body>
</html>

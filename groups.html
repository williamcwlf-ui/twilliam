<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Groups</title>
<link rel="stylesheet" href="style.css">
<style>
.g-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:26px;max-width:1100px;margin:34px auto 90px;padding:0 6vw}
.g-card{position:relative;overflow:hidden;display:flex;flex-direction:column;min-height:370px;border-radius:24px;background:#eef3fd;color:#0b0b0b;box-shadow:0 22px 50px #0007;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.g-banner{position:relative;z-index:2;height:150px;flex:none}
.g-banner img{display:block;width:100%;height:100%;object-fit:cover}
.g-mark{position:absolute;right:-50px;bottom:-70px;width:250px;height:250px;z-index:0;background:#d3e1f7;-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat}
.g-mark.ring{background:none;border:62px solid #d3e1f7;border-right-color:transparent;border-radius:50%;-webkit-mask:none;mask:none}
.g-body{position:relative;z-index:1;margin-top:auto;padding:22px 28px 26px;max-width:84%}
.g-body h2{font-size:38px;font-weight:500;letter-spacing:-.025em;line-height:1.1;overflow-wrap:anywhere}
.g-body p{margin-top:12px;color:#666;font-size:15px;line-height:1.6}
.g-body a{display:inline-block;margin-top:14px;color:#1871cd;font-size:14px;text-decoration:none}
.g-body a:hover{text-decoration:underline}
.g-body a:focus-visible{outline:2px solid #1871cd;outline-offset:3px}
.g-empty{max-width:1100px;margin:40px auto;padding:0 6vw;color:var(--mute)}
</style>
</head>
<body>
<canvas id="stars" aria-hidden="true"></canvas>
<header><nav aria-label="Main"></nav></header>
<main>
  <div class="title">
    <h1>Groups</h1>
    <p id="intro"></p>
  </div>
  <div class="g-grid" id="groups"></div>
</main>
<footer></footer>
<script src="site.js"></script>
<script>
if (typeof CONFIG === "undefined") {
  document.querySelector("main").insertAdjacentHTML("beforeend", "<p style='padding:6vw'>site.js did not load. Put site.js in the same folder as this page.</p>");
  throw new Error("site.js missing");
}
document.getElementById("intro").textContent = "The groups and communities behind " + CONFIG.company + ".";
const wrap = document.getElementById("groups");
const shortLink = u => u.replace(/^https?:\/\//, "").replace(/\/$/, "");
if (!CONFIG.groups || !CONFIG.groups.length) {
  wrap.outerHTML = "<p class='g-empty'>No groups yet. Add them in the groups list in site.js.</p>";
} else CONFIG.groups.forEach((g, i) => {
  const card = document.createElement("article");
  card.className = "g-card";
  card.innerHTML = `<div class="g-banner"></div><i class="g-mark"></i><div class="g-body"><h2></h2><p></p><a target="_blank" rel="noopener"></a></div>`;
  const hue = [210, 160, 275, 25, 340, 190][i % 6];
  const ban = card.querySelector(".g-banner");
  ban.style.background = "linear-gradient(135deg,#68a9ed,#1871cd)";
  if (g.banner) { const im = new Image(); im.alt = ""; im.onload = () => ban.appendChild(im); im.src = g.banner; }
  const mark = card.querySelector(".g-mark");
  if (g.logo) mark.style.setProperty("--logo", `url("${g.logo}")`); else mark.classList.add("ring");
  card.querySelector("h2").textContent = g.title || "";
  card.querySelector("p").textContent = g.subtitle || "";
  const a = card.querySelector("a");
  if (g.link) { a.href = g.link; a.textContent = shortLink(g.link); } else a.remove();
  wrap.appendChild(card);
});
</script>
</body>
</html>
